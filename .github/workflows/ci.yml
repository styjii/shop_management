name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values: they protect nothing and are never used in production.
  DJANGO_SECRET_KEY: ci-only-secret-key-0123456789-0123456789-0123456789
  DJANGO_DEBUG: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/dev.txt ruff pyright

      - name: Lint (Ruff)
        run: .venv/bin/ruff check backend

      - name: Type check (Pyright)
        run: .venv/bin/pyright

      - name: Check that migrations are up to date
        working-directory: backend
        run: ../.venv/bin/python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: ../.venv/bin/python manage.py test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Allow headless Chrome sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: never blocks the pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements/base.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
