name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values: they protect nothing and are never used in production.
  DJANGO_SECRET_KEY: ci-only-secret-key-0123456789-0123456789-0123456789
  DJANGO_DEBUG: "1"

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements/dev.txt pyright

      - name: Lint (Ruff)
        run: .venv/bin/ruff check backend

      - name: Lint the maintenance script (ShellCheck)
        run: shellcheck deploy/maintenance.sh

      - name: Type check (Pyright)
        run: .venv/bin/pyright

      - name: Check that migrations are up to date
        working-directory: backend
        run: ../.venv/bin/python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: ../.venv/bin/python manage.py test

      - name: Production settings audit
        working-directory: backend
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-Zq7!-Zq7!-Zq7!-Zq7!-Zq7!-Zq7!-Zq7!-Zq7!-0123456789
          DJANGO_ALLOWED_HOSTS: shop.example.com
          TRUST_PROXY_SSL: "1"
        run: ../.venv/bin/python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular 22 needs Node 22.22.3+, 24.15+ or 26+
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,css}"

      - name: Build
        run: npx ng build

      - name: Run tests (Vitest + jsdom, no browser needed)
        run: npx ng test --watch=false

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: never blocks the pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements/prod.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=critical
